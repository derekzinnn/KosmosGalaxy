<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- The Universo Kosmos planet: a filled body with the ring knocked out as
       negative space, plus two tips continuing the ring beyond the planet.
       Black on transparent; recolour the two fills to taste. -->
  <mask id="planet" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
    <rect width="32" height="32" fill="black" />
    <circle cx="16" cy="16" r="10" fill="white" />
    <rect x="-2" y="14.7" width="36" height="2.6" rx="1.3" fill="black" transform="rotate(-19 16 16)" />
  </mask>
  <circle cx="16" cy="16" r="10" fill="#000000" mask="url(#planet)" />
  <g transform="rotate(-19 16 16)">
    <rect x="2.4" y="14.7" width="4.4" height="2.6" rx="1.3" fill="#000000" />
    <rect x="25.2" y="14.7" width="4.4" height="2.6" rx="1.3" fill="#000000" />
  </g>
</svg>
