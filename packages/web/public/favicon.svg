<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    The Universo Kosmos planet, the same mark as components/Logo.tsx. Filled in
    Kosmos blue (#0140BF) so it reads on both a light and a dark browser chrome
    from one file; the ring is knocked out as negative space, with two tips.
  -->
  <mask id="fav-planet" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
    <rect width="32" height="32" fill="black" />
    <circle cx="16" cy="16" r="10" fill="white" />
    <rect x="-2" y="14.7" width="36" height="2.6" rx="1.3" fill="black" transform="rotate(-19 16 16)" />
  </mask>
  <circle cx="16" cy="16" r="10" fill="#0140bf" mask="url(#fav-planet)" />
  <g transform="rotate(-19 16 16)">
    <rect x="2.4" y="14.7" width="4.4" height="2.6" rx="1.3" fill="#0140bf" />
    <rect x="25.2" y="14.7" width="4.4" height="2.6" rx="1.3" fill="#0140bf" />
  </g>
</svg>
